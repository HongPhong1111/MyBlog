name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Quan trọng: kéo luôn theme Hugo nếu có

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          # Bắt buộc cho theme Blowfish và các theme dùng SCSS/SASS
          extended: true

      - name: Build site
        run: |
          hugo --minify --baseURL "https://hongphong1111.github.io/MyBlog/" --verbose
          echo "Build completed. Checking public directory:"
          ls -la public/
          echo "Checking images directory:"
          ls -la public/images/ || echo "Images directory not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4