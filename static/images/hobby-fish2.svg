<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#63b3ed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Aquarium background -->
  <rect width="400" height="300" fill="url(#tankGrad)"/>
  
  <!-- Plants -->
  <path d="M 50 300 Q 55 250, 60 200 Q 65 250, 70 300" fill="#48bb78" opacity="0.5"/>
  <path d="M 350 300 Q 355 260, 360 220 Q 365 260, 370 300" fill="#48bb78" opacity="0.5"/>
  
  <!-- Fish group - Ranchu -->
  <ellipse cx="100" cy="120" rx="30" ry="25" fill="#ff6b6b" opacity="0.9"/>
  <circle cx="90" cy="115" r="2" fill="#000"/>
  
  <ellipse cx="200" cy="150" rx="35" ry="28" fill="#ffd93d" opacity="0.9"/>
  <circle cx="188" cy="145" r="2" fill="#000"/>
  
  <ellipse cx="300" cy="130" rx="32" ry="26" fill="#ff8080" opacity="0.9"/>
  <circle cx="290" cy="126" r="2" fill="#000"/>
  
  <ellipse cx="150" cy="190" rx="28" ry="23" fill="#333" opacity="0.9"/>
  <circle cx="142" cy="186" r="2" fill="#fff"/>
  
  <!-- Bubbles -->
  <circle cx="120" cy="80" r="4" fill="#fff" opacity="0.4"/>
  <circle cx="250" cy="100" r="5" fill="#fff" opacity="0.4"/>
  <circle cx="180" cy="60" r="3" fill="#fff" opacity="0.4"/>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">🐠 Cá Ranchu Đáng Yêu</text>
</svg>

