baseURL = 'https://your-blog-domain.com/'
languageCode = 'vi-vn'
title = 'Blog Lập Trình Mạng - Nguyễn Phong'
theme = 'PaperMod'

# Enable raw HTML in markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Output formats for search
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # Thiết lập giao diện
  defaultTheme = "auto"  # auto, light, dark
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  
  # Tùy chỉnh màu sắc và giao diện
  [params.assets]
    disableFingerprinting = false
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
  
  # Tùy chỉnh hiển thị bài viết
  [params.cover]
    linkFullImages = true
    
  # Tùy chỉnh hiển thị danh sách bài viết
  [params.list]
    showSummary = true

  # Chế độ hiển thị profile - TẮT để sử dụng list view tối giản
  [params.profileMode]
    enabled = false
    
  # Tùy chỉnh hiển thị trang chủ
  [params.homeInfoParams]
    Title = "Lập Trình Mạng"
    Content = "Chia sẻ kiến thức về Java và JavaScript"
  
  # Enable search functionality
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"
    
  [[params.socialIcons]]
    name = "email"
    url = "mailto:your-email@example.com"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/yourusername"

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Bài Viết"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Danh Mục"
    url = "/categories/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Thẻ"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "archives"
    name = "Lưu Trữ"
    url = "/archives/"
    weight = 35
  [[menu.main]]
    identifier = "about"
    name = "Giới Thiệu"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "Tìm Kiếm"
    url = "/search/"
    weight = 50
