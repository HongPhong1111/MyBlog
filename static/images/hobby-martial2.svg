<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="octagonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Arena background -->
  <rect width="400" height="300" fill="url(#octagonGrad)"/>
  
  <!-- Octagon ring outline -->
  <polygon points="200,50 280,90 320,170 280,250 200,290 120,250 80,170 120,90" 
           fill="none" stroke="#e53e3e" stroke-width="4" opacity="0.6"/>
  
  <!-- Center circle -->
  <circle cx="200" cy="170" r="60" fill="none" stroke="#e53e3e" stroke-width="3" opacity="0.4"/>
  
  <!-- Training figure -->
  <circle cx="200" cy="140" r="18" fill="#fff" opacity="0.9"/>
  <rect x="192" y="158" width="16" height="35" fill="#fff" opacity="0.9"/>
  <rect x="188" y="168" width="8" height="25" fill="#e53e3e" opacity="0.9"/>
  <rect x="204" y="168" width="8" height="25" fill="#e53e3e" opacity="0.9"/>
  <rect x="192" y="193" width="8" height="30" fill="#1a202c" opacity="0.9"/>
  <rect x="200" y="193" width="8" height="30" fill="#1a202c" opacity="0.9"/>
  
  <!-- Boxing gloves in action -->
  <circle cx="170" cy="175" r="10" fill="#e53e3e"/>
  <circle cx="230" cy="175" r="10" fill="#e53e3e"/>
  
  <!-- Impact lines -->
  <line x1="160" y1="175" x2="140" y2="175" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="158" y1="170" x2="138" y2="165" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="158" y1="180" x2="138" y2="185" stroke="#fff" stroke-width="2" opacity="0.6"/>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="24" fill="#e53e3e" text-anchor="middle" font-weight="bold">🥋 Boxing Training</text>
</svg>

