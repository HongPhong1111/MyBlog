<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gym background -->
  <rect width="400" height="300" fill="url(#gymGrad)"/>
  
  <!-- Mat pattern -->
  <rect x="0" y="220" width="400" height="80" fill="#e53e3e" opacity="0.3"/>
  
  <!-- Boxing bag -->
  <rect x="300" y="50" width="60" height="120" rx="10" fill="#4a5568"/>
  <line x1="330" y1="50" x2="330" y2="0" stroke="#718096" stroke-width="3"/>
  
  <!-- Fighter silhouette -->
  <circle cx="150" cy="100" r="20" fill="#fff" opacity="0.8"/>
  <rect x="140" y="120" width="20" height="40" fill="#fff" opacity="0.8"/>
  <rect x="135" y="130" width="10" height="30" fill="#fff" opacity="0.8"/>
  <rect x="165" y="130" width="10" height="30" fill="#fff" opacity="0.8"/>
  <rect x="140" y="160" width="10" height="35" fill="#fff" opacity="0.8"/>
  <rect x="160" y="160" width="10" height="35" fill="#fff" opacity="0.8"/>
  
  <!-- Boxing gloves -->
  <circle cx="120" cy="140" r="12" fill="#e53e3e"/>
  <circle cx="180" cy="140" r="12" fill="#e53e3e"/>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="24" fill="#e53e3e" text-anchor="middle" font-weight="bold">🥊 Võ Thuật</text>
</svg>

