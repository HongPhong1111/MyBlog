<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7209B7;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="white" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="80" r="60" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="320" r="80" fill="white" opacity="0.1"/>
  <circle cx="950" cy="100" r="40" fill="white" opacity="0.15"/>
  
  <!-- Code Symbols -->
  <text x="150" y="150" font-family="monospace" font-size="80" fill="white" opacity="0.2">&lt;/&gt;</text>
  <text x="900" y="250" font-family="monospace" font-size="60" fill="white" opacity="0.2">{ }</text>
  
  <!-- Main Text -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    Blog Lập Trình Mạng
  </text>
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.9">
    Chia sẻ kiến thức Java &amp; JavaScript
  </text>
  
  <!-- Decorative Lines -->
  <line x1="400" y1="260" x2="800" y2="260" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>

