<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2c5aa0;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Water background -->
  <rect width="400" height="300" fill="url(#waterGrad)"/>
  
  <!-- Bubbles -->
  <circle cx="50" cy="50" r="5" fill="#fff" opacity="0.3"/>
  <circle cx="100" cy="80" r="3" fill="#fff" opacity="0.4"/>
  <circle cx="350" cy="100" r="4" fill="#fff" opacity="0.3"/>
  
  <!-- Fish 1 - Ranchu (Red) -->
  <ellipse cx="150" cy="150" rx="40" ry="30" fill="#ff4444" opacity="0.9"/>
  <ellipse cx="130" cy="150" rx="20" ry="15" fill="#ff6666"/>
  <circle cx="125" cy="145" r="3" fill="#000"/>
  <path d="M 110 150 Q 100 140, 90 150 Q 100 160, 110 150" fill="#ff4444" opacity="0.7"/>
  <path d="M 190 145 Q 200 140, 210 145" stroke="#ff4444" stroke-width="2" fill="none"/>
  
  <!-- Fish 2 - Ranchu (White/Pink) -->
  <ellipse cx="280" cy="180" rx="35" ry="28" fill="#ffcccc" opacity="0.9"/>
  <ellipse cx="265" cy="180" rx="18" ry="14" fill="#ffe6e6"/>
  <circle cx="260" cy="176" r="3" fill="#000"/>
  <path d="M 245 180 Q 235 172, 225 180 Q 235 188, 245 180" fill="#ffcccc" opacity="0.7"/>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">🐟 Nuôi Cá Cảnh</text>
</svg>

